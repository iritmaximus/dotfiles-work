[language-server.typescript-language-server]
command = "tsc"
args = ["--lsp", "--stdio"]

[language-server.oxfmt]
command = "oxfmt"
args = ["--lsp"]

[language-server.oxlint]
command = "oxlint"
args = ["--lsp"]

[[language]]
name = "typescript"
language-servers = [
  { name = "oxfmt", only-features = ["format"] },
  { name = "oxlint", only-features = ["diagnostics"] },
  "typescript-language-server"
]
auto-format = true

[[language]]
name = "tsx"
language-servers = [
  { name = "oxfmt", only-features = ["format"] },
  { name = "oxlint", only-features = ["diagnostics"] },
  "typescript-language-server"
]
auto-format = true

[[language]]
name = "javascript"
language-servers = [
  { name = "oxfmt", only-features = ["format"] },
  { name = "oxlint", only-features = ["diagnostics"] },
  "typescript-language-server"
]
auto-format = true

[[language]]
name = "jsx"
language-servers = [
  { name = "oxfmt", only-features = ["format"] },
  { name = "oxlint", only-features = ["diagnostics"] },
  "typescript-language-server"
]
auto-format = true


[[language]]
name = "latex"

[language-server.texlab.config.texlab.forwardSearch]
executable = "zathura"
args = [ "--synctex-forward", "%l:%c:%f", "%p" ]

[language-server.texlab.config.texlab.build]
# auxDirectory = "build"
# logDirectory = "build"
# pdfDirectory = "build"

forwardSearchAfter = true
onSave = true

executable = "tectonic"
args = [
  "-X",
  "compile",
  "-Z",
  "search-path=/usr/share/texlive/texmf-dist/tex/latex/biblatex", # output of `dirname "$(kpsewhich biblatex.sty)"`
  "--synctex",
  "--keep-logs",
  "--keep-intermediates",
  # "--outdir=build",
  "%f",
]

[language-server.texlab.config.texlab.chktex]
onOpenAndSave = true
onEdit = true
